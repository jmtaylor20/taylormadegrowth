# Kemp & Sons Printing marketing site (kempandsons.com).
# Static Astro build. The custom job form is handled by Netlify Forms.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Staff pages and API stay out of search results permanently.
[[headers]]
  for = "/staff/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Background remover: model and runtime download once, then come from the browser cache.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/ort/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# The Netlify address forwards to the real domain, so search engines and links see one site.
[[redirects]]
  from = "https://kemp-sons-site.netlify.app/*"
  to = "https://kempandsons.com/:splat"
  status = 301
  force = true

# The old prototype addresses now go to the permanent "Start an order" pages.
[[redirects]]
  from = "/prototype/design/:template/"
  to = "/design/:template/"
  status = 301

[[redirects]]
  from = "/prototype/*"
  to = "/start/"
  status = 301

# Unlisted print-sample pages for Kemp's staff stay out of search results.
[[headers]]
  for = "/samples/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
