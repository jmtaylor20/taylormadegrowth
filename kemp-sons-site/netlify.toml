# Kemp & Sons Printing marketing site (kempandsons.com).
# Static Astro build. The custom job form is handled by Netlify Forms.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Preview only: keeps the site out of search results until launch. Remove at launch.
    X-Robots-Tag = "noindex, nofollow"

# Staff pages and API stay out of search results permanently.
[[headers]]
  for = "/staff/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Background remover: model and runtime download once, then come from the browser cache.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/ort/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
