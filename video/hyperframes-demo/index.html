<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0c0b0b;
        --ink: #f1efec;
        --gold: #c9a24a;
        --growth: #57c08a;
        --font-display: Georgia, serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); }
      .clip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #logo { width: 720px; }
      #rule { width: 0; height: 4px; background: var(--gold); margin-top: 48px; }
      #title { color: var(--ink); font-size: 96px; letter-spacing: -0.02em; }
      #sub { color: var(--growth); font-size: 44px; margin-top: 24px; font-family: sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="scene1" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <img id="logo" src="assets/logo.png" alt="TaylorMade Growth" />
        <div id="rule"></div>
      </div>
      <div id="scene2" class="clip" data-start="3" data-duration="3" data-track-index="1">
        <h1 id="title">Video pipeline online</h1>
        <p id="sub">HyperFrames · GSAP · FFmpeg</p>
      </div>
      <audio id="music" src="assets/tone.mp3" data-start="0" data-duration="6" data-track-index="2"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#logo", { opacity: 0.4, scale: 0.94 }, { opacity: 1, scale: 1, duration: 1, ease: "power3.out" }, 0)
        .to("#rule", { width: 600, duration: 1, ease: "power2.inOut" }, 0.6)
        .fromTo("#title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 3.1)
        .fromTo("#sub", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 3.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
